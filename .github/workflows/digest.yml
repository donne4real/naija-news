name: Daily Naija News Digest

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_PROVIDER: ${{ secrets.LLM_FALLBACK_PROVIDER }}
          LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          OUT_DIR: public
          DEDUP_THRESHOLD: ${{ secrets.DEDUP_THRESHOLD }}
          RANK_SOURCE_WEIGHT: ${{ secrets.RANK_SOURCE_WEIGHT }}
          RANK_RECENCY_HOURS: ${{ secrets.RANK_RECENCY_HOURS }}
          TOP_N: ${{ secrets.TOP_N }}
          DIGEST_SIZE: ${{ secrets.DIGEST_SIZE }}
        run: python -m src.run

      - name: Commit daily digest to archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/digests public/archive.html
          if git diff --cached --quiet; then
            echo "No new digest to commit"
          else
            git commit -m "Archive digest $(date -u +%F)"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.PAGES_PROJECT_NAME }}
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naija News Digest</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f7fa;color:#222}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px}
h1{color:#2c3e50}
.card{background:#fff;border-radius:10px;padding:18px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h2{margin:0 0 6px;font-size:18px}
.sources{font-size:12px;color:#888;margin-bottom:8px}
.summary{line-height:1.6}
.why{background:#f0f7ff;padding:8px 12px;border-left:3px solid #2c3e50;margin:10px 0;font-size:14px}
a{color:#2c3e50}
.footer{font-size:12px;color:#888;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Naija News Digest</h1>
  <p>Latest: {{ latest_date }}</p>
  {% for it in items %}
  <div class="card">
    <h2>{{ loop.index }}. {{ it.title }}</h2>
    <div class="sources">{{ it.sources|join(', ') }}</div>
    <div class="summary">{{ it.summary }}</div>
    {% if it.why %}<div class="why"><strong>Why it matters:</strong> {{ it.why }}</div>{% endif %}
    <p><a href="{{ it.link }}" target="_blank" rel="noopener">Read original</a></p>
  </div>
  {% endfor %}
  <div class="footer">Generated {{ generated_at }}.</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naija News Digest — Archive</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f7fa;color:#222}
.wrap{max-width:800px;margin:0 auto;padding:24px 20px}
h1{color:#008751;margin-bottom:4px}
.sub{color:#666;font-size:14px;margin-bottom:16px}
a{color:#008751}
ul{list-style:none;padding:0}
li{background:#fff;border-radius:8px;padding:12px 16px;margin:8px 0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
li a{font-weight:600;text-decoration:none}
.footer{font-size:12px;color:#888;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇳🇬 Naija News Digest — Archive</h1>
  <div class="sub">Past daily roundups</div>
  <ul>
  {% for d in digests %}
    <li><a href="digests/{{ d }}.html">{{ d }}</a></li>
  {% endfor %}
  </ul>
  <p><a href="index.html">← Latest</a></p>
  <div class="footer">Generated {{ generated_at }}.</div>
</div>
</body>
</html>
